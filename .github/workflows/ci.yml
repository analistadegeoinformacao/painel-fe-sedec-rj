# Roda em todo Pull Request. Usa a AMOSTRA anonimizada (tests/fixtures),
# então não precisa de credencial e pode rodar em PR de qualquer pessoa.
# Configure a proteção da branch main para exigir que este job passe.
name: Verificação de PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python -m etl.build --fonte texto --origem tests/fixtures/amostra.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-painel-pr
          path: e2e/test-results/
          retention-days: 7
