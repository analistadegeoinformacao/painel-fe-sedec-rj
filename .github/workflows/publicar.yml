# Atualiza e publica o painel.
# Roda: quando o "Vigia da planilha" (vigia.yml) vê dados novos, a cada push na main,
# manualmente (botão "Run workflow") e, de reserva, pelo agendamento abaixo.
# Nas execuções agendadas, só republica se os dados mudaram (ou a cada 10 min,
# como sinal de vida para o selo "Última leitura") — ver etl/precisa_publicar.py.
# Se QUALQUER etapa falhar (planilha fora do contrato, teste quebrado), a etapa
# de publicação não roda e o site continua com a última versão boa.
name: Atualizar e publicar painel

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # reserva: o GitHub atrasa muito o agendamento; quem garante os 5 min é o vigia
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Enquanto a planilha não estiver conectada (segredos ausentes), o fluxo só
  # registra um aviso e termina sem erro — nada de e-mail de falha a cada 30 min.
  verificar:
    runs-on: ubuntu-24.04
    outputs:
      pronto: ${{ steps.v.outputs.pronto }}
    steps:
      - id: v
        env:
          URL: ${{ secrets.APPS_SCRIPT_URL }}
          TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
        run: |
          if [ -n "$URL" ] && [ -n "$TOKEN" ]; then
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Planilha ainda não conectada: cadastre APPS_SCRIPT_URL e APPS_SCRIPT_TOKEN (ver README)."
          fi

  construir:
    needs: verificar
    if: needs.verificar.outputs.pronto == 'true'
    runs-on: ubuntu-24.04
    outputs:
      publicar: ${{ steps.decidir.outputs.publicar }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Testes do ETL
        run: pytest -q

      # Leitura gratuita via Apps Script dentro da planilha (apps-script/Codigo.gs).
      - name: Ler planilha, validar e gerar dados
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
        # em caso de erro, a mensagem vira uma anotação visível no resumo da execução
        run: |
          set -o pipefail
          python -m etl.build --fonte appsscript 2>&1 | tee etl.log || {
            msg=$(grep -E "ERRO|Error|recusou|SystemExit|HTTP|não devolveu|precisam" etl.log | tail -5 | tr '\n' ' ')
            echo "::error title=Leitura da planilha falhou::${msg:-$(tail -3 etl.log | tr '\n' ' ')}"
            exit 1
          }
          # resumo visível na execução: quantas linhas cada aba trouxe
          python -c "import json;m=json.load(open('site/data/meta.json'));print('::notice title=Linhas lidas::'+' · '.join(f'{k}={v[\"linhas\"]}' for k,v in m['conjuntos'].items()))"
          python -c "import json;m=json.load(open('site/data/meta.json'));[print(f'::notice title=Depuração {k}::'+json.dumps(v['depuracao'],ensure_ascii=False)) for k,v in m['conjuntos'].items() if 'depuracao' in v]"
          python -c "import json,collections;d=json.load(open('site/data/sisgeo.json'));c=collections.Counter((r.get('condicao_climatica') or '(vazia)', r.get('tipo') or '?') for r in d if 'situacao' not in (r.get('depuracao') or '') and 'motivo' not in (r.get('depuracao') or ''));print('::notice title=Condição climática x tipo (sisgeo)::'+' · '.join(f'{a} / {b}={n}' for (a,b),n in c.most_common(40)))"
          python -c "import json;d=json.load(open('site/data/sisgeo.json'));print('::notice title=Sem município (sisgeo, ordem da planilha)::'+' · '.join(f'{r.get(\"situacao\")} / depuração={r.get(\"depuracao\") or \"válida\"}' for r in d if not r.get('cod_ibge'))[:3000])"
          # avisos da Qualidade dos dados, também visíveis no resumo da execução
          python -c "import json;m=json.load(open('site/data/meta.json'));[print(f'::notice title=Qualidade {k}::'+' || '.join(v)[:3000]) for k,v in m.get('avisos',{}).items() if v]"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Precisa republicar?
        id: decidir
        run: python -m etl.precisa_publicar --base "${{ steps.pages.outputs.base_url }}" --evento "${{ github.event_name }}"

      - uses: actions/setup-node@v4
        if: steps.decidir.outputs.publicar == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Teste de fumaça no navegador (com os dados recém-gerados)
        if: steps.decidir.outputs.publicar == 'true'
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Guardar print do painel
        if: always() && steps.decidir.outputs.publicar == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: print-painel
          path: e2e/test-results/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        if: steps.decidir.outputs.publicar == 'true'
        with:
          path: site

  publicar:
    needs: construir
    if: needs.construir.outputs.publicar == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
