# Atualiza e publica o painel.
# Roda: a cada 30 min, a cada push na main, ou manualmente (botão "Run workflow").
# Se QUALQUER etapa falhar (planilha fora do contrato, teste quebrado), a etapa
# de publicação não roda e o site continua com a última versão boa.
name: Atualizar e publicar painel

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"      # horário UTC; o GitHub pode atrasar alguns minutos
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Enquanto a planilha não estiver conectada (segredos ausentes), o fluxo só
  # registra um aviso e termina sem erro — nada de e-mail de falha a cada 30 min.
  verificar:
    runs-on: ubuntu-24.04
    outputs:
      pronto: ${{ steps.v.outputs.pronto }}
    steps:
      - id: v
        env:
          URL: ${{ secrets.APPS_SCRIPT_URL }}
          TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
        run: |
          if [ -n "$URL" ] && [ -n "$TOKEN" ]; then
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Planilha ainda não conectada: cadastre APPS_SCRIPT_URL e APPS_SCRIPT_TOKEN (ver README)."
          fi

  construir:
    needs: verificar
    if: needs.verificar.outputs.pronto == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Testes do ETL
        run: pytest -q

      # Leitura gratuita via Apps Script dentro da planilha (apps-script/Codigo.gs).
      - name: Ler planilha, validar e gerar dados
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
        run: python -m etl.build --fonte appsscript

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Teste de fumaça no navegador (com os dados recém-gerados)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Guardar print do painel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-painel
          path: e2e/test-results/
          retention-days: 7

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
