# Atualizações chegam como PR; só entram se a "Verificação de PR" passar.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: monthly }
